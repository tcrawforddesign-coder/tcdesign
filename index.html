      @keyframes tci-seed{0%{opacity:0;transform:translate(-88.8px,0) scale(0)}25%{opacity:1;transform:translate(-88.8px,0) scale(2.6)}45%{transform:translate(-88.8px,0) scale(2.2)}100%{opacity:1;transform:none}}

      @keyframes tci-word{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#tc-intro *{animation:none!important}#tc-intro .ring{display:none}}
      @media (prefers-reduced-transparency:reduce){#tc-intro .pill{background:rgba(255,255,255,.94);-webkit-backdrop-filter:none;backdrop-filter:none}}

    <script>
      /* Logo intro and loading screen. Plays the halftone logo animation, holds
         (red point pulsing) until the app has rendered, then flies the lockup
         into the header logo and reveals the page. Click or any key skips it. */
      (function () {
        var d = document, h = d.documentElement, el = d.getElementById("tc-intro");
        if (!el) return;
        var lock = el.querySelector(".lock"), bg = el.querySelector(".bg");
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var seen = false;
        try { seen = sessionStorage.getItem("tc-intro") === "1"; sessionStorage.setItem("tc-intro", "1"); } catch (e) {}
        if (seen || reduce) el.classList.add("instant");
        var fit = function () { lock.style.setProperty("--s", Math.min(1, (window.innerWidth - 40) / 960)); };
        fit();
        window.addEventListener("resize", fit);
        h.classList.add("tc-intro-on");
        var introDone = false, appReady = !!window.__tcAppReady, docked = false;
        var finishIntro = function () { if (introDone) return; introDone = true; if (!appReady) el.classList.add("wait"); go(); };
        setTimeout(finishIntro, seen || reduce ? 300 : 3500);
        window.addEventListener("tc:app-ready", function () { appReady = true; go(); });
        var skip = function () { if (!introDone) { el.classList.add("instant"); finishIntro(); } };
        el.addEventListener("click", skip);
        window.addEventListener("keydown", skip);
        setTimeout(function () { appReady = true; finishIntro(); }, 9000);
        function go() {
          if (docked || !introDone || !appReady) return;
          docked = true;
          var ready = d.fonts && d.fonts.ready ? d.fonts.ready : Promise.resolve();
          Promise.race([ready, new Promise(function (r) { setTimeout(r, 600); })]).then(function () { requestAnimationFrame(dock); });
        }
        function cleanup() {
          window.removeEventListener("resize", fit);
          window.removeEventListener("keydown", skip);
          h.classList.remove("tc-intro-on");
          if (el.parentNode) el.parentNode.removeChild(el);
          window.__tcIntroDone = true;
          window.dispatchEvent(new Event("tc:intro-done"));
        }
        function fade() {
          el.style.transition = "opacity .35s ease";
          el.style.opacity = "0";
          setTimeout(cleanup, 380);
        }
        function dock() {
          el.classList.remove("wait");
          var target = d.querySelector(".tc-logo-pill");
          if (!target || reduce || !lock.animate) return fade();
          var r0 = lock.getBoundingClientRect(), t = target.getBoundingClientRect();
          if (!t.width) return fade();
          var s0 = r0.width / 960, s1 = t.width / 960;
          var dx = t.left - r0.left, dy = t.top + (t.height - 280 * s1) / 2 - r0.top;
          lock.style.position = "fixed";
          lock.style.margin = "0";
          lock.style.left = r0.left + "px";
          lock.style.top = r0.top + "px";
          lock.style.transformOrigin = "0 0";
          lock.style.transform = "scale(" + s0 + ")";
          el.style.cursor = "default";
          var ease = "cubic-bezier(.65,0,.35,1)";
          var move = lock.animate(
            [{ transform: "translate(0,0) scale(" + s0 + ")" }, { transform: "translate(" + dx + "px," + dy + "px) scale(" + s1 + ")" }],
            { duration: 800, easing: ease, fill: "forwards" }
          );
          bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 650, delay: 150, easing: "ease", fill: "forwards" });
          move.onfinish = function () {
            h.classList.remove("tc-intro-on");
            lock.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: "ease", fill: "forwards" }).onfinish = cleanup;
          };
        }
      })();
    </script>
